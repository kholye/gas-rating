# Будильник: раз в ~3 дня читает настоящие данные из базы, чтобы бесплатный Supabase не засыпал.
# Успех = HTTP 200 и в ответе есть роль (значит, ключ принят и база читает данные). Иначе задача падает, и GitHub присылает письмо.
name: keepalive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Прочитать данные из базы
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GAS_CODE: ${{ secrets.GAS_CODE }}
        run: |
          set -euo pipefail
          for v in SUPABASE_URL SUPABASE_ANON_KEY GAS_CODE; do [ -n "${!v}" ] || { echo "Секрет $v пустой или не создан"; exit 1; }; done
          SUPABASE_URL="${SUPABASE_URL%/}"; GAS_CODE="$(printf %s "$GAS_CODE" | tr -d '[:space:]')"; SUPABASE_ANON_KEY="$(printf %s "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"
          echo "::add-mask::$GAS_CODE"
          auth=()
          case "$SUPABASE_ANON_KEY" in sb_*) ;; *) auth=(-H "Authorization: Bearer $SUPABASE_ANON_KEY") ;; esac
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/get_all" \
            -H "apikey: $SUPABASE_ANON_KEY" "${auth[@]}" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg c "$GAS_CODE" '{p_code:$c}')")
          if [ "$code" != "200" ]; then echo "База ответила HTTP $code (код устарел? проект спит?)"; exit 1; fi
          jq -e '.role == "user" or .role == "admin"' body.json > /dev/null || { echo "Ответ без роли: база ответила не так, как ожидалось"; exit 1; }
          echo "База отвечает: мест $(jq '.places | length' body.json), рецензий $(jq '.reviews | length' body.json)"
