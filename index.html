<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="referrer" content="origin">
<title>G.A.S. Rating</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
/* Шрифты лежат в репозитории (vendor/fonts): внешние серверы не нужны. */
@font-face{font-family:"Onest";font-weight:100 900;font-display:swap;src:url(vendor/fonts/onest-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Onest";font-weight:100 900;font-display:swap;src:url(vendor/fonts/onest-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"JetBrains Mono";font-weight:100 800;font-display:swap;src:url(vendor/fonts/jbmono-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"JetBrains Mono";font-weight:100 800;font-display:swap;src:url(vendor/fonts/jbmono-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{ /* светлая тема */
  --bg:#F5F5F1; --s1:#FFFFFF; --s2:#EEEEE8; --ln:#DEDED6; --ln2:#C6C6BC;
  --ink:#0E0E10; --mut:#62626E; --dim:#8C8C96;
  --acc:#C8F25A; --on-acc:#0E0E10; --acc-text:#3E6A00; --acc-soft:rgba(200,242,90,.35);
  --vio:#5B4BE0; --vio-soft:rgba(91,75,224,.09); --bad:#C92A2A;
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#0E0E10; --s1:#16161A; --s2:#1E1E24; --ln:#2A2A32; --ln2:#3A3A44;
  --ink:#F2F2F0; --mut:#9A9AA6; --dim:#5C5C68;
  --acc-text:#C8F25A; --acc-soft:rgba(200,242,90,.12);
  --vio:#8F82FF; --vio-soft:rgba(143,130,255,.1); --bad:#FF7A7A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E10; --s1:#16161A; --s2:#1E1E24; --ln:#2A2A32; --ln2:#3A3A44;
    --ink:#F2F2F0; --mut:#9A9AA6; --dim:#5C5C68;
    --acc-text:#C8F25A; --acc-soft:rgba(200,242,90,.12);
    --vio:#8F82FF; --vio-soft:rgba(143,130,255,.1); --bad:#FF7A7A;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);
  padding:env(safe-area-inset-top) 20px calc(28px + env(safe-area-inset-bottom))}
#app{max-width:520px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc-text)}
.hidden{display:none!important}
.muted{color:var(--mut)}
.small{font-size:13px}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* шапка */
header.bar{display:flex;align-items:center;gap:10px;min-height:68px;padding:10px 0 6px}
header.bar h1{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0;flex:1;min-width:0;line-height:1.15;overflow-wrap:anywhere}
header.bar .brand{font-family:var(--mono);font-size:13px;letter-spacing:.12em;color:var(--mut);font-weight:500}
.icon-btn{width:44px;height:44px;flex:none;border:1px solid var(--ln);background:var(--s1);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.icon-btn:hover{border-color:var(--ln2)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* меню */
.hero{font-weight:800;font-size:clamp(48px,17vw,72px);line-height:.95;letter-spacing:-.045em;margin:14px 0 24px}
.hero i{font-style:normal;color:var(--acc-text)}
.tile{display:block;width:100%;border:1px solid var(--ln);background:var(--s1);border-radius:24px;text-align:left;padding:18px;position:relative;overflow:hidden}
.tile.primary{background:var(--acc);color:var(--on-acc);border-color:transparent;min-height:150px;padding:20px}
.tile .tag{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:500}
.tile.primary .ttl{display:block;margin-top:8px;font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.02em;max-width:160px}
.letters{position:absolute;right:18px;bottom:18px;display:flex;gap:6px}
.letters b{width:40px;height:54px;border-radius:12px;background:#0E0E10;color:#C8F25A;display:flex;align-items:center;justify-content:center;font:700 24px var(--mono)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.tile.sq{height:152px;display:flex;flex-direction:column;justify-content:space-between}
.tile.sq .tag{color:var(--mut);opacity:1}
.tile.sq .num{display:block;font:700 44px/1 var(--mono);letter-spacing:-.04em}
.tile.sq .ttl{display:block;margin-top:6px;font-weight:600;font-size:16px}
.tile.sq .tag,.tile.sq .ttl{position:relative}
.tile.map .grid{position:absolute;inset:0;background-image:radial-gradient(circle,var(--dim) 1.3px,transparent 1.7px);background-size:14px 14px;background-position:9px 9px;-webkit-mask-image:linear-gradient(205deg,#000 0%,rgba(0,0,0,.55) 38%,transparent 78%);mask-image:linear-gradient(205deg,#000 0%,rgba(0,0,0,.55) 38%,transparent 78%)}
.tile.map .route{position:absolute;inset:0;width:100%;height:100%}
.tile.map .pin{position:absolute;left:calc(69% - 5px);top:calc(33% - 5px);width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 5px var(--acc-soft)}
.tile.map .pin2{position:absolute;left:calc(12% - 4px);top:calc(62% - 4px);width:8px;height:8px;border-radius:50%;background:var(--vio)}
.tile.rate{margin-top:12px;border-style:dashed;border-color:var(--ln2);background:none;display:flex;align-items:center;gap:14px;padding:16px 20px;min-height:84px}
.tile.rate .plus{width:44px;height:44px;border-radius:14px;background:var(--vio);color:#0E0E10;display:flex;align-items:center;justify-content:center;flex:none}
.tile.rate b{display:block;font-size:17px;font-weight:600}
.tile.rate small{color:var(--mut);font-size:13px}
.foot{display:flex;align-items:center;gap:10px;margin-top:26px;font-family:var(--mono);font-size:12px;color:var(--mut)}
.foot select{width:auto;min-height:36px;padding:4px 8px;border-radius:10px;font-family:var(--mono);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.foot .dot{animation:blink 2.4s ease-in-out infinite}
.foot.off .dot{background:var(--bad);animation:none}
.net p{margin:0 0 8px;font:500 13px/1.45 var(--mono)}
.net p.bad{color:var(--bad)}
@keyframes blink{50%{opacity:.35}}

/* общие элементы */
.card{background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:12px}
h2{font-size:22px;margin:6px 0 12px;font-weight:800;letter-spacing:-.03em}
input[type=text],input[type=search],select,textarea{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--s1);min-height:46px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--vio);outline-offset:2px}
textarea{min-height:92px;resize:vertical}
label.lbl,span.lbl{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--ln2);background:none;font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn.accent{background:var(--acc);color:var(--on-acc);border-color:transparent;font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--ln)}
.btn.block{width:100%}
.btn{gap:8px;white-space:nowrap}
.btn svg.i{width:18px;height:18px;flex:none}
.lbl-short{display:none}
@media (max-width:1023px){.lbl-long{display:none}.lbl-short{display:inline}}
.me-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:4px}
.ver-line{display:block;margin:14px auto 0;border:0;background:none;color:var(--dim);font:500 11px var(--mono);letter-spacing:.06em;cursor:pointer}
.ver{margin-left:auto;border:1px solid var(--ln);background:none;color:var(--dim);font:500 11px var(--mono);border-radius:8px;padding:3px 8px;cursor:pointer}
.errc pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.45 var(--mono);color:var(--mut);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;margin:8px 0;max-height:220px;overflow:auto}
.btn[disabled]{opacity:.5;cursor:default}
.notice{border-radius:16px;padding:12px 14px;border:1px solid var(--vio);background:var(--vio-soft);font-size:14px;margin:12px 0;display:flex;gap:10px;align-items:flex-start}
.notice svg.i{width:18px;height:18px;flex:none;margin-top:2px;color:var(--vio)}
.notice.soft{border-color:var(--ln2);background:var(--s1)}
.notice.soft svg.i{color:var(--mut)}
.how{margin-top:12px;font-size:13px;color:var(--mut)}
.how summary{cursor:pointer;padding:6px 0}
.how p{margin:4px 0 0;line-height:1.5}
.err{color:var(--bad);font-size:14px;margin-top:8px}

/* значок звёзд: 3/3 */
.badge{display:inline-flex;align-items:center;gap:2px;height:26px;padding:0 8px;border-radius:9px;border:1px solid var(--ln2);font:700 12px var(--mono);color:var(--mut);white-space:nowrap;flex:none}
.badge svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;fill:none}
.badge svg.on{fill:currentColor}
.badge svg.off{opacity:.35}
.badge.b3{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-text)}
.badge.b2,.badge.b1{border-color:var(--ln2);color:var(--ink)}
.badge.b0{border-color:var(--ln2);color:var(--mut)}
.big{font:700 34px/1 var(--mono);letter-spacing:-.04em;color:var(--acc-text);white-space:nowrap}
.big small{font-size:16px;color:var(--dim);letter-spacing:0}
.big.b0{color:var(--bad)} .big.b1{color:var(--ink)}

/* список */
.item{display:block;width:100%;text-align:left;background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.item:hover{border-color:var(--ln2)}
.item .t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-weight:700;font-size:17px;line-height:1.25}
.item .meta{color:var(--mut);font-size:13px;margin-top:3px}
.item.top{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;height:156px;padding:14px 18px 16px;border-color:var(--acc)}
.item.top .ph{position:absolute;top:0;right:0;bottom:0;width:70%;background:linear-gradient(135deg,rgba(143,130,255,.4),rgba(200,242,90,.3)) center/cover}
.item.top .shade{position:absolute;inset:0;background:linear-gradient(90deg,var(--s1) 0%,var(--s1) 28%,color-mix(in srgb,var(--s1) 60%,transparent) 58%,rgba(200,242,90,.26) 100%)}
.item.top .lbl3,.item.top .bot{position:relative;width:100%;box-sizing:border-box}
.item.top .bot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.item.top .txt{flex:1;min-width:0}
.item.top .sc{flex:none}
.item.top .lbl3{display:flex;gap:8px;font:500 11px var(--mono);letter-spacing:.12em;color:var(--acc-text)}
.item.top .lbl3 b{font-weight:700}
.item.top .nm{font-weight:800;font-size:22px;letter-spacing:-.03em;line-height:1.1}
.item.top .sc{font:700 34px/1 var(--mono);letter-spacing:-.04em;color:var(--acc-text);text-shadow:0 1px 12px var(--s1)}
.item.thin{border-style:dashed;border-color:var(--ln2)}
.thin-tag{flex:none;padding-top:5px;font:500 10px var(--mono);letter-spacing:.12em;color:var(--vio);white-space:nowrap}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0 12px;font:500 11px var(--mono);letter-spacing:.12em;color:var(--mut)}
.divider::after{content:"";flex:1;height:1px;background:var(--ln)}
.lb-load{position:absolute;left:0;right:0;bottom:24px;text-align:center;font:500 12px var(--mono);color:#fff;text-shadow:0 1px 6px #000}
.btn.icon-only{flex:none;width:48px;padding:0;justify-content:center}
.btn.icon-only svg.i{width:20px;height:20px}
.chip.price{color:var(--ink);border-color:var(--ln2);display:inline-flex;align-items:baseline;gap:4px;text-transform:none;white-space:nowrap}
.chip.price i{font-style:normal;color:var(--acc-text);font-weight:700}
.chip.price em{font-style:normal;color:var(--dim);margin:0 3px}
.chip.price small{font-size:inherit;color:var(--mut);text-transform:uppercase}
.price-row{gap:10px}
.price-in{flex:1;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--ln2);background:var(--s1)}
.price-in span{color:var(--mut);font-size:14px}
.price-in input{flex:1;min-width:0;border:0;background:none;padding:0;min-height:44px;font:700 17px var(--mono);color:var(--ink);outline:none}
.price-in:focus-within{border-color:var(--acc)}
.chip-btn{min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--ln2);background:none;color:var(--mut);font:500 11px var(--mono);letter-spacing:.04em;cursor:pointer}
.chip-btn:hover{color:var(--ink);border-color:var(--mut)}
.pricebox{margin-top:14px}
.pr-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pr-head b{font:700 16px var(--mono)}
.pr-scale{position:relative;height:40px;margin-top:10px}
.pr-line{position:absolute;left:0;right:0;top:19px;height:2px;background:var(--ln)}
.pr-scale i{position:absolute;display:block;border-radius:4px}
.pr-one{top:10px;height:4px;background:var(--ln2)}
.pr-one:nth-of-type(odd){top:26px}
.pr-avg{top:17px;height:6px;background:var(--acc)}
.pr-scale i.open{border-radius:0}
.pr-scale i.open[style^="left:0%"]{border-radius:0 4px 4px 0}
.pr-ticks{position:relative;height:14px;font:500 10px var(--mono);color:var(--dim)}
.pr-ticks span{position:absolute;transform:translateX(-50%)}
.pr-ticks span:first-child{left:0;transform:none}
.pr-ticks span:last-child{transform:translateX(-100%)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:8px;border:1px solid var(--ln);color:var(--mut)}
.chip.warn{border-color:var(--vio);color:var(--vio)}

/* шкалы-полоски */
.bars{display:grid;grid-template-columns:78px 1fr 34px;gap:9px 10px;align-items:center;font:12px var(--mono);color:var(--mut);margin:16px 0}
.bars .seg5{display:flex;gap:4px}
.bars .seg5 i{flex:1;height:6px;border-radius:3px;background:var(--ln)}
.bars .seg5 i.on{background:var(--acc)}
:root[data-theme="light"] .bars .seg5 i.on{background:#7FA800}
.bars b{color:var(--ink);font-weight:500;text-align:right}

/* карточка места */
.ph-head{display:flex;gap:14px;align-items:flex-start;margin-top:6px}
.ph-head h1{font-weight:800;font-size:32px;line-height:1.02;letter-spacing:-.04em;margin:6px 0 0;overflow-wrap:anywhere}

/* рецензии как посты */
.thread{margin-top:10px}
.post{display:flex;gap:12px}
.post .side{display:flex;flex-direction:column;align-items:center;flex:none}
.post .line{flex:1;width:2px;margin-top:6px;background:var(--ln);border-radius:1px}
.post .main{flex:1;min-width:0;padding-bottom:18px}
.post:last-child .main{padding-bottom:6px}
.post .hd{display:flex;align-items:center;gap:6px;min-height:46px}
.post .hd b{font-weight:700;font-size:15px}
.post .hd .ago{font-size:13px;color:var(--mut)}
.post .hd .badge{margin-left:auto}
.post p{margin:0;font-size:15px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-line}
.post .stats{margin-top:10px;display:flex;gap:6px 12px;flex-wrap:wrap;font:11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
.thumbs:empty{display:none}
.thumbs .thumb:only-child{grid-column:1/-1}
.thumb{position:relative;display:block}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;border:1px solid var(--ln);display:block;cursor:zoom-in;background:var(--s2)}
.thumb:only-child img{aspect-ratio:16/10}
.thumb .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:1px solid var(--ln2);background:var(--s1);color:var(--bad);line-height:1;font-size:18px;padding:0}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:2000;padding:12px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}


/* аватарки */
.av-tile{width:46px;height:46px;border-radius:16px;background:var(--s1);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;flex:none}
.me-tile{position:relative;width:60px;height:60px;flex:none;border-radius:20px;border:1px solid var(--ln2);background:var(--s1);display:flex;align-items:center;justify-content:center;padding:0;overflow:visible}
header.mehead{padding-top:14px}
.me-tile .crown{position:absolute;top:-9px;right:-7px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.mename{font-weight:700;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere}
@keyframes av-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes av-look{0%,40%,100%{transform:translateX(0)}50%,60%{transform:translateX(2.2px)}70%,80%{transform:translateX(-2.2px)}}
@keyframes av-hop{0%,91%,100%{transform:translateY(0)}94%{transform:translateY(-5px)}97%{transform:translateY(0)}}
@keyframes av-tw{0%,100%{transform:scale(.35);opacity:.25}50%{transform:scale(1);opacity:1}}
.av-anim{animation:av-hop 9s ease-in-out infinite;transform-origin:50% 100%}
.av-anim .eyes{animation:av-look 7s ease-in-out infinite}
.av-anim .blink{transform-box:fill-box;transform-origin:center;animation:av-blink 4.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.av-anim .tw{transform-box:fill-box;transform-origin:center;animation:av-tw 2.4s ease-in-out infinite}
.avatar-svg{display:block}
@media (prefers-reduced-motion: reduce){.av-anim,.av-anim .eyes,.av-anim .blink,.av-anim .tw{animation:none}}

/* форма */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1 1 0;min-width:0;position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;gap:2px;min-height:46px;border:1px solid var(--ln);border-radius:14px;background:var(--s1);text-align:center;padding:0 6px;font-size:15px}
.seg input:checked + span{background:var(--acc);color:var(--on-acc);border-color:transparent;font-weight:700}
.seg input:focus-visible + span{outline:2px solid var(--vio);outline-offset:2px}
.scale-row{margin-top:14px}
.scale-row .name{font-size:14px;margin-bottom:6px}
input[type=file]{width:100%;padding:12px;border:1px dashed var(--ln2);border-radius:14px;background:var(--s1)}
.form-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.form-thumbs .thumb{width:76px}
.form-thumbs .thumb img{aspect-ratio:1;border-radius:12px}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--acc);border:2px solid #0E0E10;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin span{display:block;transform:rotate(45deg);text-align:center;color:#0E0E10;font:700 12px/26px var(--mono)}
#map,#pickmap,#wpick{height:60vh;min-height:320px;border-radius:22px;border:1px solid var(--ln)}
#pickmap,#wpick{height:300px;margin-top:8px}
.leaflet-container{font:inherit}
/* полосы прокрутки в стиле сайта (тонкие, в цвет линий) */
*{scrollbar-width:thin;scrollbar-color:var(--ln2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:10px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
/* тёмная карта: подложка OpenStreetMap перекрашивается фильтром (метки и всплывашки не трогаем) */
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.6)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.6)}}
.leaflet-container{background:var(--s2)}
/* всплывашки на карте в цветах темы (иначе светлые звёзды не видны на белом) */
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--s1);color:var(--ink);border:1px solid var(--ln2);box-shadow:0 4px 16px rgba(0,0,0,.35)}
.leaflet-popup-content-wrapper{border-radius:14px}
.leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.5}
.leaflet-container a.leaflet-popup-close-button{color:var(--mut)}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--s1);color:var(--ink);border-bottom-color:var(--ln)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--s1) 80%,transparent)!important;color:var(--mut)}
.leaflet-control-attribution a{color:var(--mut)}


/* слот-машина */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;inset:0;margin:0;width:100%;height:100%;cursor:pointer}
.pill span{display:flex;align-items:center;height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--ln2);font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.pill input:checked + span{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-text)}
.pill input:focus-visible + span{outline:2px solid var(--vio);outline-offset:2px}
.result{margin-top:16px;border:1px solid var(--ln);background:var(--s1);border-radius:26px;padding:20px}
.result h3{margin:0;font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.03em;overflow-wrap:anywhere}
.fx{position:absolute;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:5}
/* автомат «Табло»: табло тёмное в обеих темах, как настоящее на вокзале */
.btn.sm{min-height:40px;padding:0 12px;font-size:13px;border-radius:12px}
.btn.sm svg.i{width:16px;height:16px}
header.bar .btn.sm{flex:none}
.board{position:relative;margin-top:6px;border-radius:20px;background:#050506;border:1px solid #2A2A32;padding:14px 12px 16px;display:flex;flex-direction:column;gap:12px;color:#F2F2F0}
.b-top{display:flex;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:.14em;color:#9A9AA6}
.b-ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btries{white-space:nowrap}
.b-dot{width:8px;height:8px;border-radius:50%;background:#C8F25A;animation:bdot 1s steps(2) infinite}
@keyframes bdot{50%{opacity:.25}}
.b-snd{width:34px;height:30px;border-radius:9px;border:1px solid #2A2A32;background:none;color:#9A9AA6;display:flex;align-items:center;justify-content:center;padding:0}
.b-snd svg.i{width:16px;height:16px}
.b-modes{display:flex;gap:6px}
.b-mode{flex:1;min-height:36px;border-radius:9px;border:1px solid #2A2A32;background:#0A0A0C;color:#9A9AA6;font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:0 4px}
.b-mode.on{border-color:#C8F25A;color:#C8F25A}
.b-mode:disabled{opacity:.6;cursor:default}
.b-line{height:1px;background:#1F1F25}
.b-row{display:flex;align-items:center;gap:8px}
.b-lbl{width:52px;flex:none;font:500 10px var(--mono);letter-spacing:.1em;color:#9A9AA6}
.board .flaps{flex:1;min-width:0;display:flex;gap:2px;justify-content:center}
.fl{flex:1 1 0;min-width:0;max-width:17px;height:26px;border-radius:3px;background:linear-gradient(#1F1F25 0,#1F1F25 49%,#0A0A0C 49%,#0A0A0C 53%,#18181D 53%);display:flex;align-items:center;justify-content:center;font:700 15px var(--mono);color:#F2F2F0;overflow:hidden}
.fl.dim{color:#5C5C68}
.fl.go{animation:flap .14s linear infinite}
@keyframes flap{45%{transform:scaleY(.2)}}
.b-name{display:flex;flex-direction:column;gap:4px}
.b-name .nl{display:flex;gap:2px;justify-content:center}
.fl.big{max-width:20px;height:34px;font-size:19px;color:#C8F25A}
.fl.big.dim{color:#5C5C68}
.b-lock{width:34px;height:34px;flex:none;border-radius:9px;border:1px solid #2A2A32;background:none;color:#5C5C68;display:flex;align-items:center;justify-content:center;padding:0}
.b-lock svg.i{width:15px;height:15px}
.b-lock.on{border-color:#8F82FF;color:#CFC9FF;background:rgba(143,130,255,.16)}
.b-lock:disabled{opacity:.35;cursor:default}
.board button:focus-visible,.spin:focus-visible{outline:2px solid #8F82FF;outline-offset:2px}
.spin{display:block;width:100%;margin-top:12px;min-height:56px;border:0;border-radius:16px;background:var(--acc);color:var(--on-acc);font:800 15px var(--mono);letter-spacing:.2em}
.spin:disabled{opacity:.5;cursor:default}
.roomstrip{display:flex;align-items:center;gap:10px;margin:2px 0 10px;border-radius:16px;border:1px solid var(--ln);background:var(--s1);padding:8px 10px}
.roomstrip b{display:block;font-size:14px}
.roomstrip small{display:block;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-avs{display:flex;flex:none}
.r-av{width:34px;height:34px;border-radius:11px;overflow:hidden;border:2px solid var(--s1);background:var(--s2);display:flex;align-items:center;justify-content:center}
.r-av+.r-av{margin-left:-10px}
.r-av svg{width:30px;height:30px}
.result .r-tag{font:500 11px var(--mono);letter-spacing:.1em;color:var(--mut);margin-bottom:8px}
.result.jack{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.result.jack .r-tag{color:var(--acc-text)}
.result.vetoed h3{text-decoration:line-through;color:var(--mut)}
.result.vetoed .r-tag{color:var(--bad)}
.btn.veto{color:var(--bad);border-color:var(--ln2)}
/* главная: «Как сходили?» и место дня в плитке автомата */
.askgo{border-radius:18px;border:1px solid var(--vio);background:var(--vio-soft);padding:14px;margin:8px 0 4px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.35}
.askgo .btn{min-height:42px}
.tile.primary.has-pod{display:flex;flex-direction:column}
.pod{display:flex;flex-direction:column;gap:6px;margin-top:14px;border-radius:12px;background:#0E0E10;padding:10px}
.pod .tag{color:#9A9AA6;opacity:1;font-size:10px}
.pod .flaps{display:flex;gap:2px}
.pod .fl{max-width:16px;height:24px;font-size:13px;color:#C8F25A}
/* места: вкладки, «Хочу сходить», кухня плитками */
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--ln);margin:2px 0 12px}
.tab{flex:1;min-height:38px;border-radius:10px;border:0;background:none;color:var(--mut);font-weight:600;font-size:14px}
.tab.on{background:var(--acc);color:var(--on-acc)}
.kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.kt{min-height:50px;border-radius:14px;border:1px solid var(--ln);background:var(--s1);color:var(--ink);font-size:13px;font-weight:600;line-height:1.15;text-align:left;padding:6px 10px}
.kt.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-text)}
.kt.more{color:var(--mut);border-style:dashed}
.want-add{margin-bottom:14px}
.wrow{display:flex;align-items:center;gap:8px;border-radius:16px;border:1px dashed var(--ln2);padding:8px 8px 8px 14px;margin-bottom:8px}
.wrow.sel{border-color:var(--acc)}
.wmain{border:0;background:none;text-align:left;padding:4px 0;min-width:0}
.wmain b{display:block;font-size:15px}
.wmain small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
@media (prefers-reduced-motion: reduce){.b-dot,.fl.go{animation:none}}
/* оценка сравнением: карточки со свайпом */
.cmp{display:flex;flex-direction:column;gap:12px}
.cmp-top{display:flex;justify-content:space-between}
.cmp-bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden}
.cmp-bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.cmp-target{display:flex;align-items:center;gap:10px;border-radius:16px;border:1px solid var(--acc);background:var(--acc-soft);padding:10px 12px}
.cmp-target b{display:block;font-size:16px;font-weight:800;line-height:1.15}
.cmp-q{margin:4px 0 0;text-align:center;font-weight:800;font-size:21px;letter-spacing:-.02em}
.cmp-stage{position:relative;height:min(58vh,470px);min-height:340px}
.cmp-card{position:absolute;inset:0;border-radius:26px;border:1px solid var(--ln);background:var(--s1);overflow:hidden;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.cmp-card:active{cursor:grabbing}
.cov{position:relative;display:block;flex:1;min-height:0;background:#121216 center/cover no-repeat;overflow:hidden}
.cov .poster{position:absolute;inset:0;width:100%;height:100%;display:block}
.cov.sm{flex:none;width:44px;height:44px;border-radius:12px}
.cov-kind{position:absolute;left:14px;bottom:14px;font:500 11px var(--mono);letter-spacing:.1em;font-style:normal;background:#0E0E10;border-radius:8px;padding:5px 8px}
.cmp-bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
.cmp-bd b{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stamp{position:absolute;top:22px;padding:6px 12px;border-radius:10px;border:3px solid;font:800 18px var(--mono);letter-spacing:.08em;background:rgba(14,14,16,.65);opacity:0;pointer-events:none}
.stamp.yes{left:18px;color:#C8F25A;border-color:#C8F25A;transform:rotate(-12deg)}
.stamp.no{right:18px;color:#FF8A6B;border-color:#FF8A6B;transform:rotate(12deg)}
.stamp.same{left:50%;top:40%;transform:translateX(-50%);color:#B3AAFF;border-color:#B3AAFF}
.cmp-btns{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:4px}
.cb{width:62px;height:62px;border-radius:50%;border:1px solid var(--ln2);background:var(--s1);color:var(--ink);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0}
.cb.no{color:var(--bad)}
.cb.same{width:48px;height:48px;font-size:18px;color:var(--vio)}
.cb.yes{width:72px;height:72px;background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-size:26px}
.cmp-intro{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.cmp-intro h2{margin:0;font-weight:800;font-size:34px;line-height:1.02;letter-spacing:-.04em}
.cmp-intro p{margin:0;font-size:15px;line-height:1.5}
.cmp-top-list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-weight:600}
.dk .cmp,.dk .cmp-intro{max-width:520px}
/* лента «Что нового»: табло под плитками (телефон) и коротко в панели (ПК) */
.board.feed{margin-top:16px;gap:6px}
.f-row{display:grid;grid-template-columns:44px 74px minmax(0,1fr);gap:8px;align-items:baseline;width:100%;border:0;background:none;padding:4px 0;text-align:left;font:500 11px var(--mono);color:#9A9AA6;opacity:.55}
.f-row.new{opacity:1}
.f-row .t{color:#5C5C68}
.f-row .w,.f-row .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-row .p{color:#F2F2F0}
.f-row .p em{font-style:normal}
.f-row.new .p em{color:#C8F25A}
.f-head{opacity:1;font-size:9px;letter-spacing:.12em;color:#5C5C68;padding-top:2px}
button.f-row:hover{opacity:1}
.f-new{color:#C8F25A;white-space:nowrap}
.f-more{border:0;background:none;color:#C8F25A;font:600 13px var(--sans);text-align:left;padding:6px 0 0}
.r-feed{border:1px solid var(--ln);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.r-fh{display:flex;align-items:center;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.r-fh span{flex:1}
.r-fh b{background:var(--acc);color:var(--on-acc);border-radius:6px;padding:1px 6px;font-size:10px}
.r-fi{display:flex;gap:8px;align-items:center;border:0;background:none;padding:0;text-align:left;color:var(--mut);font-size:12px;line-height:1.3}
.r-fi b{color:var(--ink)}
.r-fa{width:22px;height:22px;flex:none;border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--s2)}
.r-fa svg{width:22px;height:22px}
.r-fa i{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.r-fall{border:0;background:none;padding:0;text-align:left;color:var(--acc-text);font-weight:600;font-size:12px}
/* ---------- ПК-версия (от 1024 px): панель слева, список и карта или карточка места рядом ---------- */
.dk-only{display:none}
.item.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
@media (min-width:1024px){
  body.desk{padding:0}
  body.desk #app{max-width:none}
  .dk{display:grid;grid-template-columns:248px minmax(360px,440px) minmax(0,1fr);height:100vh;height:100dvh}
  .dk.one{grid-template-columns:248px minmax(0,1fr)}
  .dk .dk-only{display:block}
  .rail{border-right:1px solid var(--ln);padding:22px 18px;display:flex;flex-direction:column;gap:18px;overflow:auto}
  .r-brand{display:flex;align-items:baseline;gap:8px}
  .r-brand b{font-weight:800;font-size:22px;letter-spacing:-.03em}
  .r-brand span{font:500 10px var(--mono);letter-spacing:.14em;color:var(--mut)}
  .r-me{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left}
  .r-me .me-tile{width:52px;height:52px;border-radius:17px}
  .r-me b{display:block;font-size:15px}
  .r-me small{display:block;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-top:2px}
  .r-cta{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;border:0;background:var(--acc);color:var(--on-acc);text-align:left}
  .r-cta .tag{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
  .r-cta .ttl{font-weight:800;font-size:24px;line-height:1.02;letter-spacing:-.03em}
  .r-cta .letters{position:static;display:flex;gap:6px;justify-content:flex-end}
  .r-cta .letters b{width:38px;height:44px;border-radius:10px;background:#0E0E10;color:#C8F25A;display:flex;align-items:center;justify-content:center;font:700 20px var(--mono)}
  .r-cta.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
  .r-list{display:flex;flex-direction:column;gap:4px}
  .r-nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid transparent;background:none;color:var(--mut);font-weight:600;font-size:14px;text-align:left;width:100%}
  .r-nav span{flex:1}
  .r-nav small{font:500 11px var(--mono);color:var(--dim)}
  .r-nav:hover{color:var(--ink)}
  .r-nav.on{background:var(--s1);border-color:var(--ln2);color:var(--ink)}
  .r-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
  .r-foot .foot{margin-top:4px;font-size:11px}
  .r-ver{border:0;background:none;padding:2px 0 0 18px;text-align:left;color:var(--dim);font:500 10px var(--mono);letter-spacing:.06em;cursor:pointer}
  .r-ver:hover{color:var(--mut)}
  .dk .thumbs{grid-template-columns:repeat(auto-fill,minmax(140px,180px))}
  .dk .thumbs .thumb:only-child{grid-column:auto}
  .dk-a,.dk-b{overflow:auto;min-width:0;padding:4px 24px 32px}
  .dk.two .dk-a{border-right:1px solid var(--ln)}
  .dk.one .dk-a{padding:8px 40px 48px}
  .dk.one .dk-a>*{max-width:760px}
  .dk .bar [data-act=theme]{display:none}
  .dk.two .dk-a .bar [data-act=back]{display:none}
  .dk.two:not(.v-detail) .dk-b{display:flex;flex-direction:column;padding-bottom:0}
  .dk-b #map.map-pane{flex:1;height:auto;min-height:420px;margin:20px 0}
  .dk.v-detail .dk-b{padding:4px 36px 40px}
  .dk.v-slot .dk-a>*{max-width:1100px}
  .dk.v-slot header.bar{min-height:96px}
  .dk.v-slot header.bar h1{font-size:56px;line-height:.95;letter-spacing:-.05em}
  .dk.v-slot header.bar h1::after{content:".";color:var(--acc)}
  .dk .slot-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
  .dk .slot-r{display:flex;flex-direction:column;gap:16px}
  .dk .slot-r .result{margin-top:6px}
  .dk .res-map{min-height:300px;border-radius:26px;border:1px solid var(--ln);overflow:hidden}
  .dk .board{padding:18px 16px 20px;gap:14px}
  .dk .fl{max-width:24px;height:34px;font-size:19px}
  .dk .fl.big{max-width:28px;height:44px;font-size:25px}
  .dk .b-lbl{width:60px;font-size:11px}
}
@media (prefers-reduced-motion: reduce){.foot .dot{animation:none}}
</style>
