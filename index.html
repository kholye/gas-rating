<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="referrer" content="origin">
<title>G.A.S. Rating</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
:root{
  --bg:#f7f5f0; --surface:#fff; --ink:#1c1b19; --muted:#6b6860; --line:#e6e2d8;
  --accent:#d9480f; --accent-ink:#fff; --star:#f08c00; --bad:#c92a2a; --ok:#2b8a3e;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --r:16px;
}
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1d1b18; --ink:#f1ede4; --muted:#a39e91; --line:#2e2b26;
  --accent:#ff8a3d; --accent-ink:#1a0f05; --star:#ffb020; --bad:#ff6b6b; --ok:#69db7c;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141311; --surface:#1d1b18; --ink:#f1ede4; --muted:#a39e91; --line:#2e2b26;
    --accent:#ff8a3d; --accent-ink:#1a0f05; --star:#ffb020; --bad:#ff6b6b; --ok:#69db7c;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
#app{max-width:520px;margin:0 auto}
header.bar{display:flex;align-items:center;gap:8px;padding:14px 0 10px;min-height:56px}
header.bar h1{font-size:18px;margin:0;flex:1;letter-spacing:.02em}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.icon-btn{min-width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:18px}
.back{border:0;background:none;font-size:16px;color:var(--accent);min-height:44px;padding:0 4px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.menu-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px 16px;margin-bottom:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-height:72px}
.menu-btn .ico{font-size:28px;width:36px;text-align:center}
.menu-btn b{display:block;font-size:17px}
.menu-btn small{color:var(--muted)}
.menu-btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.menu-btn.primary small{color:inherit;opacity:.85}
h2{font-size:22px;margin:6px 0 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stars{color:var(--star);letter-spacing:2px;white-space:nowrap}
.stars .off{opacity:.28}
.zero{color:var(--bad);font-weight:600;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=search],select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:44px}
textarea{min-height:88px;resize:vertical}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.item .t{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.item .meta{color:var(--muted);font-size:13px;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1 1 0;min-width:0;position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:center;padding:0 6px;font-size:15px}
.seg input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.seg input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.scale-row{margin-top:10px}
.scale-row .name{font-size:14px;margin-bottom:4px}
.switch{display:flex;align-items:center;gap:10px;min-height:44px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.notice{border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-size:14px;margin:10px 0}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.review{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.review:first-child{border-top:0;margin-top:0;padding-top:0}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:14px;margin-top:6px}
.scores div{display:flex;justify-content:space-between}
#map,#pickmap{height:60vh;min-height:320px;border-radius:var(--r);border:1px solid var(--line)}
#pickmap{height:300px;margin-top:8px}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin span{display:block;transform:rotate(45deg);text-align:center;color:var(--accent-ink);font-weight:700;font-size:13px;line-height:26px}
.leaflet-container{font:inherit}
/* слот-машина */
.machine{display:flex;gap:10px;align-items:stretch;margin:14px 0}
.reels{flex:1;display:flex;gap:6px;background:var(--ink);padding:10px;border-radius:var(--r);box-shadow:var(--shadow)}
.reel{flex:1;height:84px;overflow:hidden;background:var(--surface);border-radius:10px;position:relative}
.reel .strip{will-change:transform}
.reel .cell{height:84px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-weight:700;font-size:14px;line-height:1.15;overflow:hidden;overflow-wrap:anywhere}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--surface),transparent 25%,transparent 75%,var(--surface));opacity:.55;pointer-events:none}
.lever{width:56px;border:0;background:none;position:relative;padding:0}
.lever .rod{position:absolute;left:24px;top:50%;width:8px;height:70px;margin-top:-62px;background:var(--muted);border-radius:4px;transform-origin:50% 100%;transition:transform .18s ease-in}
.lever .knob{position:absolute;left:12px;top:50%;width:32px;height:32px;margin-top:-92px;background:var(--bad);border-radius:50%;box-shadow:inset -3px -3px 0 rgba(0,0,0,.2);transition:transform .18s ease-in}
.lever .base{position:absolute;left:8px;right:8px;top:50%;margin-top:4px;height:20px;background:var(--muted);border-radius:6px}
.lever.pulled .rod{transform:scaleY(.25)}
.lever.pulled .knob{transform:translateY(52px)}
.lever[disabled]{opacity:.6}
.result{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.result{animation:none}.lever .rod,.lever .knob{transition:none}}
.hidden{display:none!important}
a{color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="app.js"></script>
<noscript>Нужен включённый JavaScript.</noscript>
</body>
</html>
